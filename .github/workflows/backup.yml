# Раз на тиждень зберігає зашифровану резервну копію бази як файл у розділі Actions → Artifacts (90 днів).
name: Backup

on:
  schedule:
    - cron: '17 3 * * 0' # неділя, 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/backup.mjs backup

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Не задано секрет BACKUP_PASSPHRASE"; exit 1; }
          STAMP=$(date -u +%Y-%m-%d)
          tar -czf "backup-$STAMP.tar.gz" backup
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE -in "backup-$STAMP.tar.gz" -out "backup-$STAMP.tar.gz.enc"
          rm -rf backup "backup-$STAMP.tar.gz"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}
          path: backup-${{ env.STAMP }}.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
